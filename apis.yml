name: Verkada
description: >-
  Verkada is a cloud-managed physical security company whose platform spans security
  cameras, access control, environmental and air-quality sensors, alarms, intercoms,
  visitor/guest management, and workplace safety, all administered through Verkada
  Command. Its public Command API is a REST interface (JSON over HTTPS, standard HTTP
  status codes) that lets developers programmatically manage cameras and footage,
  access-control users, doors, credentials and schedules, sensor and alarm data,
  guest events, Helix video tagging, and organization audit logs. Authentication uses
  a scoped API Key that mints short-lived 30-minute tokens (x-verkada-auth), with
  region-specific hosts for the United States, Europe, Australia, and GovCloud, plus
  HMAC-signed event webhooks for cameras, access, alarms, and guest.
