description: >-
  Verkada publishes no first-party client library (SDK) for the Command REST API.
  The Command API is called directly over HTTPS. Verkada's GitHub org ships
  first-party mobile SDKs for the Verkada Pass mobile-credential product (not the
  Command REST API), and a community ecosystem provides unofficial Command API
  wrappers. Nothing here is a first-party Command API client, so none are marked official:true.
